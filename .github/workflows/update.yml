name: Update dashboard
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tracker.py
      - run: python senate.py
        continue-on-error: true
      - run: |
          git config user.name "vote-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update votes $(date -u +'%Y-%m-%d %H:%M')"
          git push
